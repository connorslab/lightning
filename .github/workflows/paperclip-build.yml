name: Paperclip development build
on:
  push:
    branches: [paperclip/blake2b-peer-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake build-essential libtool libsqlite3-dev libffi-dev zlib1g-dev libsodium-dev gettext lowdown libgmp-dev libpq-dev protobuf-compiler libssl-dev
      - name: Build and stage
        run: |
          ./configure --prefix=/usr
          uv run make -j2
          uv run make -j2 bitcoin/test/run-block_header_v2
          ./bitcoin/test/run-block_header_v2
          uv run make DESTDIR="$PWD/stage" install
          stage/usr/bin/lightningd --version
          stage/usr/bin/lightning-cli --version
          test -x stage/usr/libexec/c-lightning/plugins/clnrest
      - name: Package
        run: |
          mkdir dist
          cp doc/PAPERCLIP-BUILD.md stage/BUILD-NOTES.md
          git rev-parse HEAD > stage/SOURCE-COMMIT
          git diff --exit-code 415b5054af5f3da7420b253ae09dc8c19611dae5 HEAD -- bitcoin common connectd lightningd wire plugins hsmd channeld openingd closingd onchaind wallet
          tar --owner=0 --group=0 -C stage -cJf dist/paperclip-cln-baseline-ubuntu24.04-amd64.tar.xz .
          cp stage/SOURCE-COMMIT stage/BUILD-NOTES.md dist/
          cd dist
          sha256sum *.tar.xz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: paperclip-cln-baseline-ubuntu24.04-amd64
          path: dist/
          if-no-files-found: error
