name: Paperclip differentiation proposal
on:
  push:
    branches: [paperclip/blake2b-differentiation-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    env:
      RUST_PROFILE: small
      TEST_NETWORK: regtest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache/restore@v4
        with:
          path: target
          key: rust-small-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake build-essential libtool libsqlite3-dev libffi-dev zlib1g-dev libsodium-dev gettext lowdown libgmp-dev libpq-dev protobuf-compiler libssl-dev
      - name: Build and stage
        run: |
          ./configure --prefix=/usr
          uv run make -j2
          uv run make -j2 bitcoin/test/run-block_header_v2 connectd/test/run-blake2b_features
          ./bitcoin/test/run-block_header_v2
          ./connectd/test/run-blake2b_features
          uv run make DESTDIR="$PWD/stage" install
          stage/usr/bin/lightningd --version
          stage/usr/bin/lightning-cli --version
          test -x stage/usr/libexec/c-lightning/plugins/clnrest
      - uses: actions/cache/save@v4
        with:
          path: target
          key: rust-small-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Isolated regtest integration
        run: |
          .github/scripts/install-bitcoind.sh
          uv run pytest -q tests/test_blake2b_differentiation.py --timeout=120 --maxfail=1
      - name: Package
        run: |
          mkdir dist
          cp doc/PAPERCLIP-BUILD.md stage/BUILD-NOTES.md
          git rev-parse HEAD > stage/SOURCE-COMMIT
          cp doc/BLAKE2B-DIFFERENTIATION.md stage/PROPOSAL.md
          XZ_OPT='-T2 -1' tar --owner=0 --group=0 -C stage -cJf dist/paperclip-cln-proposal-ubuntu24.04-amd64.tar.xz .
          cp stage/SOURCE-COMMIT stage/BUILD-NOTES.md dist/
          cd dist
          sha256sum *.tar.xz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: paperclip-cln-proposal-ubuntu24.04-amd64
          path: dist/
          if-no-files-found: error
