name: Blake2b identity
on:
  push:
    branches: [paperclip/blake2b-peer-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake build-essential libtool libsqlite3-dev libffi-dev zlib1g-dev libsodium-dev gettext lowdown libgmp-dev
      - uses: astral-sh/setup-uv@v6
      - run: ./configure --disable-rust --enable-debugbuild
      - run: uv run make -j2 lightningd/lightningd lightningd/lightning_connectd connectd/test/run-blake2b_identity
      - run: ./connectd/test/run-blake2b_identity

